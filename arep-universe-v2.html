// ══════ ENGINE ══════
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H;
let state = 'galaxy';
let activeGalaxy = null;
let camX = 0, camY = 0, targetCamX = 0, targetCamY = 0;
let zoom = 1, targetZoom = 1;
let t = 0;
let started = false;
let isDrag = false, dragStartX, dragStartY, dragMoving = false;
let bgStars = [], nebulae = [];

function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// ── BG STARS & NEBULA
function genBg(){
  bgStars = [];
  for(let i=0;i<350;i++){
    bgStars.push({
      x:(Math.random()-0.5)*4000, y:(Math.random()-0.5)*4000,
      r:Math.random()*1.5+0.2, op:Math.random()*0.7+0.1,
      tw:Math.random()*Math.PI*2, sp:0.005+Math.random()*0.015,
      col: Math.random()>0.8 ? '#ffd166' : Math.random()>0.5 ? '#aaccff' : '#ffffff'
    });
  }
  nebulae = [];
  const cols = ['#a855f733','#00f5ff22','#f9731622','#22c55e22','#f43f5e22'];
  for(let i=0;i<8;i++){
    nebulae.push({
      x:(Math.random()-0.5)*2000, y:(Math.random()-0.5)*2000,
      rx:150+Math.random()*300, ry:80+Math.random()*200,
      rot:Math.random()*Math.PI, col:cols[i%5], op:0.4+Math.random()*0.3
    });
  }
}
genBg();

// ══════ DRAW GALAXY SHAPES ══════
function drawSpiral(sx, sy, color, dark, rot, scale=1){
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rot + t * 0.04);
  ctx.scale(scale, scale);

  // arms — draw 2 spiral arms
  for(let arm=0;arm<2;arm++){
    const armOff = arm * Math.PI;
    for(let i=0;i<120;i++){
      const frac = i/120;
      const angle = armOff + frac * Math.PI * 3.5;
      const r = frac * 90;
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r * 0.38; // flatten into disk shape
      const size = (1-frac)*3.5 + 0.5;
      const alpha = (1-frac)*0.85 + 0.05;
      // color gradient from center (bright) to edge (dark)
      const mix = frac;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${hexToRgb(color, mix)},${alpha})`;
      ctx.fill();
    }
    // dust lane
    for(let i=0;i<60;i++){
      const frac = i/60;
      const angle = armOff + 0.3 + frac * Math.PI * 3.5;
      const r = frac * 85;
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r * 0.38;
      ctx.beginPath();
      ctx.arc(x, y, 1.2, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${(1-frac)*0.3})`;
      ctx.fill();
    }
  }

  // bright core bulge
  const coreGrd = ctx.createRadialGradient(0,0,0,0,0,22);
  coreGrd.addColorStop(0,'#ffffff');
  coreGrd.addColorStop(0.3,color);
  coreGrd.addColorStop(0.7,dark);
  coreGrd.addColorStop(1,'transparent');
  ctx.beginPath();
  ctx.ellipse(0,0,22,14,0,0,Math.PI*2);
  ctx.fillStyle=coreGrd; ctx.fill();

  ctx.restore();
}

function drawElliptical(sx, sy, color, dark, rot, scale=1){
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);

  // smooth elliptical gradient layers — like lenticular galaxy
  for(let i=5;i>0;i--){
    const frac = i/5;
    const grd = ctx.createRadialGradient(0,0,0,0,0,85*frac);
    grd.addColorStop(0, color + Math.floor(frac*220).toString(16).padStart(2,'0'));
    grd.addColorStop(0.5, dark + Math.floor(frac*120).toString(16).padStart(2,'0'));
    grd.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.ellipse(0,0,85*frac,38*frac,0,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.fill();
  }

  // star field overlay
  for(let i=0;i<80;i++){
    const angle = Math.random()*Math.PI*2;
    const r = Math.random()*80;
    const x = Math.cos(angle)*r;
    const y = Math.sin(angle)*r*0.45;
    ctx.beginPath();ctx.arc(x,y,Math.random()*1.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.5})`;ctx.fill();
  }

  // bright core
  const coreGrd = ctx.createRadialGradient(0,0,0,0,0,18);
  coreGrd.addColorStop(0,'#ffffff');
  coreGrd.addColorStop(0.4,color);
  coreGrd.addColorStop(1,'transparent');
  ctx.beginPath();ctx.ellipse(0,0,18,10,0,0,Math.PI*2);
  ctx.fillStyle=coreGrd;ctx.fill();

  ctx.restore();
}

function drawIrregular(sx, sy, color, dark, rot, scale=1){
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rot + t*0.02);
  ctx.scale(scale, scale);

  // lumpy blob clusters — like Magellanic Cloud / irregular galaxy
  const clusters = [
    {x:0,y:0,rx:55,ry:45},{x:30,y:-25,rx:35,ry:28},
    {x:-35,y:20,rx:30,ry:22},{x:15,y:35,rx:25,ry:20},
    {x:-20,y:-30,rx:20,ry:18},{x:50,y:15,rx:22,ry:16},
  ];
  clusters.forEach((cl,ci)=>{
    const grd = ctx.createRadialGradient(cl.x,cl.y,0,cl.x,cl.y,cl.rx);
    const alpha = ci===0 ? 0.55 : 0.35;
    grd.addColorStop(0, color+Math.floor(alpha*255).toString(16).padStart(2,'0'));
    grd.addColorStop(0.5, dark+'44');
    grd.addColorStop(1,'transparent');
    ctx.beginPath();ctx.ellipse(cl.x,cl.y,cl.rx,cl.ry,ci*0.5,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.fill();
  });

  // scattered hot blue stars
  for(let i=0;i<60;i++){
    const angle=Math.random()*Math.PI*2;
    const r=Math.random()*75;
    const x=Math.cos(angle)*r+(Math.random()-0.5)*30;
    const y=Math.sin(angle)*r*0.8+(Math.random()-0.5)*20;
    const bright = Math.random()>0.85;
    ctx.beginPath();ctx.arc(x,y,bright?2:Math.random()*1.2,0,Math.PI*2);
    ctx.fillStyle=bright?`rgba(255,255,255,0.9)`:`rgba(255,180,180,${Math.random()*0.5+0.2})`;
    ctx.fill();
  }

  // bright nucleus
  const coreGrd=ctx.createRadialGradient(0,0,0,0,0,15);
  coreGrd.addColorStop(0,'#fff');coreGrd.addColorStop(0.5,color);coreGrd.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fillStyle=coreGrd;ctx.fill();

  ctx.restore();
}

// helper: hex to rgb interpolated
function hexToRgb(hex, mix){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  const dr=Math.floor(r*(1-mix*0.5));
  const dg=Math.floor(g*(1-mix*0.5));
  const db=Math.floor(b*(1-mix*0.5));
  return `${dr},${dg},${db}`;
}

// ══════ MAIN DRAW ══════
function loop(){
  if(!started){requestAnimationFrame(loop);return;}
  camX += (targetCamX-camX)*0.08;
  camY += (targetCamY-camY)*0.08;
  zoom += (targetZoom-zoom)*0.07;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.9);
  bg.addColorStop(0,'#03061a');bg.addColorStop(1,'#01020a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.scale(zoom,zoom);
  ctx.translate(-W/2+camX,-H/2+camY);

  // nebula bg
  nebulae.forEach(n=>{
    ctx.save();
    ctx.translate(W/2+n.x,H/2+n.y);
    ctx.rotate(n.rot+t*0.003);
    const grd=ctx.createRadialGradient(0,0,0,0,n.rx,n.ry);
    grd.addColorStop(0,n.col);grd.addColorStop(1,'transparent');
    ctx.beginPath();ctx.ellipse(0,0,n.rx,n.ry,0,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.globalAlpha=n.op;ctx.fill();
    ctx.globalAlpha=1;ctx.restore();
  });

  // bg stars
  bgStars.forEach(s=>{
    const sx=W/2-camX+s.x, sy=H/2-camY+s.y;
    const tw=Math.sin(t*s.sp+s.tw)*0.35+0.65;
    ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);
    ctx.fillStyle=s.col.replace(')',`,${s.op*tw})`).replace('rgb','rgba');
    // simpler:
    ctx.globalAlpha=s.op*tw;
    ctx.fillStyle=s.col;
    ctx.fill();
    ctx.globalAlpha=1;
  });

  if(state==='galaxy') drawGalaxyView();
  else drawSolarView();

  ctx.restore();
  t+=0.016;
  requestAnimationFrame(loop);
}

function drawGalaxyView(){
  GALAXIES.forEach(g=>{
    const sx=W/2+g.x, sy=H/2+g.y;

    // outer glow halo
    const halo=ctx.createRadialGradient(sx,sy,0,sx,sy,130);
    halo.addColorStop(0,g.color+'18');halo.addColorStop(0.5,g.color+'08');halo.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(sx,sy,130,0,Math.PI*2);ctx.fillStyle=halo;ctx.fill();

    // draw galaxy by type
    if(g.type==='spiral') drawSpiral(sx,sy,g.color,g.dark,g.rot);
    else if(g.type==='elliptical') drawElliptical(sx,sy,g.color,g.dark,g.rot);
    else drawIrregular(sx,sy,g.color,g.dark,g.rot);

    // label
    ctx.font='bold 9px Orbitron,sans-serif';
    ctx.fillStyle='#ffffff88';ctx.textAlign='center';
    ctx.fillText(g.name,sx,sy+105);
    ctx.font='9px Space Grotesk,sans-serif';
    ctx.fillStyle=g.color+'99';
    ctx.fillText(g.desc,sx,sy+118);
  });
}

function drawSolarView(){
  const g=activeGalaxy;
  if(!g) return;
  const cx=W/2-targetCamX, cy=H/2-targetCamY;

  // sun
  const pulse=1+Math.sin(t*1.5)*0.05;
  const sGrd=ctx.createRadialGradient(cx,cy,0,cx,cy,60*pulse);
  sGrd.addColorStop(0,'#ffffff');sGrd.addColorStop(0.25,g.color);sGrd.addColorStop(0.6,g.dark+'aa');sGrd.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(cx,cy,60*pulse,0,Math.PI*2);ctx.fillStyle=sGrd;ctx.fill();
  // corona
  for(let i=0;i<8;i++){
    const a=t*0.3+i*Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*25,cy+Math.sin(a)*25);
    ctx.lineTo(cx+Math.cos(a)*(35+Math.sin(t*2+i)*8),cy+Math.sin(a)*(35+Math.sin(t*2+i)*8));
    ctx.strokeStyle=g.color+'66';ctx.lineWidth=1.5;ctx.stroke();
  }

  ctx.font='bold 10px Orbitron,sans-serif';
  ctx.fillStyle=g.color;ctx.textAlign='center';
  ctx.fillText(g.name,cx,cy+75);

  g.planets.forEach(p=>{
    // orbit ring (dashed)
    ctx.save();
    ctx.setLineDash([4,8]);
    ctx.beginPath();ctx.arc(cx,cy,p.orbitR,0,Math.PI*2);
    ctx.strokeStyle='#ffffff0a';ctx.lineWidth=1;ctx.stroke();
    ctx.setLineDash([]);ctx.restore();

    const angle=p.angle+t*p.speed;
    const px=cx+Math.cos(angle)*p.orbitR;
    const py=cy+Math.sin(angle)*p.orbitR;
    p._sx=px;p._sy=py;

    // atmosphere glow
    const atm=ctx.createRadialGradient(px,py,p.r*0.5,px,py,p.r*3.5);
    atm.addColorStop(0,p.color+'55');atm.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(px,py,p.r*3.5,0,Math.PI*2);ctx.fillStyle=atm;ctx.fill();

    // planet body with gradient
    const pGrd=ctx.createRadialGradient(px-p.r*0.3,py-p.r*0.3,p.r*0.1,px,py,p.r);
    pGrd.addColorStop(0,'#ffffff55');pGrd.addColorStop(0.4,p.color);pGrd.addColorStop(1,p.color+'88');
    ctx.beginPath();ctx.arc(px,py,p.r,0,Math.PI*2);
    ctx.fillStyle=pGrd;ctx.shadowBlur=12;ctx.shadowColor=p.color;ctx.fill();ctx.shadowBlur=0;

    // ring (for some planets)
    if(p.r>=15){
      ctx.save();ctx.translate(px,py);ctx.scale(1,0.3);
      ctx.beginPath();ctx.arc(0,0,p.r*1.8,0,Math.PI*2);
      ctx.strokeStyle=p.color+'44';ctx.lineWidth=3;ctx.stroke();
      ctx.restore();
    }

    ctx.font='bold 8px Orbitron,sans-serif';
    ctx.fillStyle=p.color+'cc';ctx.textAlign='center';
    ctx.fillText(p.name,px,py-p.r-7);
  });
}

// ══════ INTERACTION ══════
function worldPos(cx,cy){
  return {x:(cx-W/2)/zoom+W/2-camX, y:(cy-H/2)/zoom+H/2-camY};
}

function onTap(cx,cy){
  const wp=worldPos(cx,cy);
  if(state==='galaxy'){
    for(const g of GALAXIES){
      const dx=wp.x-(W/2+g.x), dy=wp.y-(H/2+g.y);
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<110){
        zoomIn(g);return;
      }
    }
  } else {
    if(!activeGalaxy)return;
    const cx2=W/2-targetCamX, cy2=H/2-targetCamY;
    for(const p of activeGalaxy.planets){
      if(!p._sx)continue;
      const dx=wp.x-p._sx, dy=wp.y-p._sy;
      if(Math.sqrt(dx*dx+dy*dy)<p.r*3){
        openPanel(p);return;
      }
    }
  }
}

function zoomIn(g){
  closePanel();
  flash(()=>{
    state='solar';activeGalaxy=g;
    targetCamX=g.x;targetCamY=g.y;targetZoom=1.3;
    document.getElementById('breadcrumb').textContent=g.name+' GALAXY';
    document.getElementById('backBtn').classList.add('show');
    document.getElementById('hint').textContent='tap planet untuk explore';
  });
}
function goBack(){
  closePanel();
  flash(()=>{
    state='galaxy';activeGalaxy=null;
    targetCamX=0;targetCamY=0;targetZoom=1;
    document.getElementById('breadcrumb').textContent='Galaxy View';
    document.getElementById('backBtn').classList.remove('show');
    document.getElementById('hint').textContent='tap galaxy untuk explore';
  });
}
function flash(cb){
  const fl=document.getElementById('flash');
  fl.style.opacity='1';setTimeout(()=>{cb();fl.style.opacity='0';},220);
}
function openPanel(p){
  document.getElementById('pCat').textContent=p.cat;document.getElementById('pCat').style.color=p.color;
  document.getElementById('pTitle').textContent=p.title;document.getElementById('pTitle').style.color=p.color;
  document.getElementById('pBody').textContent=p.body;
  document.getElementById('pTags').innerHTML=p.tags.map(tg=>`<span class="p-tag" style="color:${p.color};border-color:${p.color}44">${tg}</span>`).join('');
  document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open');}

// mouse
cv.addEventListener('mousedown',e=>{isDrag=true;dragStartX=e.clientX;dragStartY=e.clientY;dragMoving=false;});
cv.addEventListener('mousemove',e=>{
  if(!isDrag)return;
  const dx=e.clientX-dragStartX,dy=e.clientY-dragStartY;
  if(Math.abs(dx)+Math.abs(dy)>6)dragMoving=true;
  if(dragMoving&&!document.getElementById('panel').classList.contains('open')){
    targetCamX-=dx/zoom*0.55;targetCamY-=dy/zoom*0.55;
    dragStartX=e.clientX;dragStartY=e.clientY;
  }
});
cv.addEventListener('mouseup',e=>{if(!dragMoving)onTap(e.clientX,e.clientY);isDrag=false;dragMoving=false;});

// touch
cv.addEventListener('touchstart',e=>{isDrag=true;dragStartX=e.touches[0].clientX;dragStartY=e.touches[0].clientY;dragMoving=false;},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(!isDrag)return;
  const dx=e.touches[0].clientX-dragStartX,dy=e.touches[0].clientY-dragStartY;
  if(Math.abs(dx)+Math.abs(dy)>8)dragMoving=true;
  if(dragMoving&&!document.getElementById('panel').classList.contains('open')){
    targetCamX-=dx/zoom*0.55;targetCamY-=dy/zoom*0.55;
    dragStartX=e.touches[0].clientX;dragStartY=e.touches[0].clientY;
  }
},{passive:true});
cv.addEventListener('touchend',e=>{if(!dragMoving)onTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);isDrag=false;dragMoving=false;});

function launch(){
  document.getElementById('intro').style.opacity='0';
  setTimeout(()=>document.getElementById('intro').style.display='none',800);
  document.getElementById('hud').classList.add('show');
  started=true;
}

loop();
</script>
